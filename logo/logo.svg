<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@700&amp;family=Nunito:wght@800&amp;display=swap');</style>
  <g transform="translate(20 22)">
  <!-- halo ring -->
  <circle cx="128" cy="128" r="116" fill="#FFF7E8"/>
  <circle cx="128" cy="128" r="116" fill="none" stroke="#9B5DE5" stroke-width="16"/>
  <circle cx="128" cy="128" r="102" fill="none" stroke="#FFFFFF" stroke-width="4" opacity=".9"/>
  <defs><clipPath id="halo"><circle cx="128" cy="128" r="106"/></clipPath></defs>
  <g clip-path="url(#halo)">

  <!-- ground -->
  <path d="M40 172 Q128 150 216 172 L216 200 Q128 216 40 200 Z" fill="#B9E88A"/>
  <path d="M28 190 Q128 176 228 190 L228 214 Q128 230 28 214 Z" fill="#8FD35C"/>

  <!-- UNICORN, facing left -->
  <g transform="translate(-14 4) scale(.92)">
    <!-- mane back -->
    <path d="M96 78 C82 66 84 46 100 44 C104 56 112 60 118 70 Z" fill="#9B5DE5"/>
    <path d="M100 86 C86 78 84 60 96 54 C102 66 110 70 116 80 Z" fill="#FF6FAE"/>
    <!-- head -->
    <path d="M56 128 C56 98 76 80 104 80 C124 80 134 94 134 118 L134 146 C134 158 124 166 110 166 L84 166 C70 166 56 152 56 128 Z" fill="#FFFFFF" stroke="#2B2340" stroke-width="5" stroke-linejoin="round"/>
    <!-- muzzle -->
    <path d="M56 128 C56 146 66 158 82 160 C70 158 62 150 60 136 Z" fill="#FFE1EE"/>
    <!-- horn -->
    <path d="M110 80 L124 40 L132 82 Z" fill="#FFC83D" stroke="#2B2340" stroke-width="5" stroke-linejoin="round"/>
    <path d="M116 66 L127 62 M113 74 L129 70" stroke="#E0A11E" stroke-width="3" stroke-linecap="round"/>
    <!-- ear -->
    <path d="M132 92 L146 76 L146 104 Z" fill="#FFFFFF" stroke="#2B2340" stroke-width="5" stroke-linejoin="round"/>
    <!-- mane front -->
    <path d="M128 84 C146 82 152 100 142 118 C138 104 130 98 122 96 Z" fill="#FF6FAE"/>
    <path d="M134 108 C148 108 152 126 142 140 C140 128 134 122 128 118 Z" fill="#9B5DE5"/>
    <!-- eye -->
    <circle cx="86" cy="118" r="7" fill="#2B2340"/>
    <circle cx="88.5" cy="115.5" r="2.4" fill="#FFFFFF"/>
    <!-- cheek + nostril -->
    <circle cx="74" cy="138" r="6" fill="#FFB1D0" opacity=".9"/>
    <circle cx="64" cy="146" r="2.6" fill="#2B2340"/>
  </g>

  <!-- SHARK, facing right -->
  <g transform="translate(30 10) scale(.86)">
    <!-- dorsal fin -->
    <path d="M158 96 L176 64 L190 100 Z" fill="#7FA6C9" stroke="#2B2340" stroke-width="5" stroke-linejoin="round"/>
    <!-- head/body -->
    <path d="M132 150 C132 116 150 96 178 96 C200 96 214 110 226 128 C232 138 232 152 224 160 C214 170 196 172 178 172 C150 172 132 168 132 150 Z" fill="#7FA6C9" stroke="#2B2340" stroke-width="5" stroke-linejoin="round"/>
    <!-- belly -->
    <path d="M140 156 C150 150 172 148 196 152 C212 155 220 160 222 162 C212 168 196 170 178 170 C158 170 144 164 140 156 Z" fill="#FFFFFF"/>
    <!-- gills -->
    <path d="M160 124 q4 8 0 16 M168 122 q4 9 0 18" stroke="#5B7C99" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- mouth + teeth -->
    <path d="M182 150 Q204 154 220 148" stroke="#2B2340" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M188 151 l3 7 3-7 M198 152 l3 7 3-7 M208 151 l3 6 3-6" fill="#FFFFFF" stroke="#2B2340" stroke-width="2" stroke-linejoin="round"/>
    <!-- eye -->
    <circle cx="198" cy="126" r="7" fill="#2B2340"/>
    <circle cx="200.5" cy="123.5" r="2.4" fill="#FFFFFF"/>
    <!-- side fin -->
    <path d="M160 160 L150 178 L176 170 Z" fill="#5B7C99" stroke="#2B2340" stroke-width="4" stroke-linejoin="round"/>
  </g>

  </g>
  <!-- sparkle -->
  <path d="M132 46 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z" fill="#FFC83D"/>
</g>
  <text x="300" y="162" font-family="Fredoka, 'Nunito', system-ui, sans-serif" font-weight="700" font-size="76" fill="#7A3FD1" letter-spacing="-1" textLength="400" lengthAdjust="spacingAndGlyphs">Mojialand</text>
  <text x="302" y="198" font-family="Nunito, system-ui, sans-serif" font-weight="800" font-size="15" fill="#6B6480" letter-spacing="3.5" textLength="396" lengthAdjust="spacingAndGlyphs">EMOJI GAMES FOR LITTLE HANDS</text>
</svg>
