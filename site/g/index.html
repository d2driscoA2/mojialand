<a id="go" href="/r/">Turn on my free 48 hours</a>
<p class="s">Works once, on a device new to Mojialand.</p>
<script>
(function(){ var c=(location.pathname.split('/')[2]||'').replace(/[^A-Za-z0-9]/g,'').slice(0,20), go=document.getElementById('go'); go.href='/r/'+c+location.search;
  /* Release 1.2 #33: this tap is the person's tap, so /r/ turns the pass on without asking twice.
     Release 1.3 #54: the flag holds the last 4 characters only, never the full code. */
  go.addEventListener('click',function(){ try{ sessionStorage.setItem('mojia.tap',JSON.stringify({l:c.toUpperCase().slice(-4),t:Date.now()})); }catch(e){} }); })();
